services:
  sentinel:
    build: .
    ports:
      - "8000:8000"
    environment:
      SENTINEL_DB: /app/data/sentinel.db
      SENTINEL_SEED: "1337"
      SENTINEL_DEMO_MODE: "1"
      SENTINEL_LLM_MODE: ok
      SENTINEL_HUMAN_KEY: demo-human-key-change-me
      SENTINEL_APPROVAL_KEY: demo-approval-key-change-me
      SENTINEL_EXEC_KEY: demo-exec-key-change-me
      SENTINEL_AGENT_PEPPER: demo-pepper-change-me
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AGENT_MODE: ${AGENT_MODE:-simulation}
      GUARD_MODE: ${GUARD_MODE:-live}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-5}
    volumes:
      - "./data:/app/data"
    command: >
      sh -c "python -m seed.seed --if-empty &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
